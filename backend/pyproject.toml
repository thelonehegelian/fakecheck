[project]
name = "fakecheck"
version = "0.1.0"
description = "A fact-checking service with Twitter bot integration"
requires-python = ">=3.8"

dependencies = [
    "tweepy==4.14.0",
    "python-decouple==3.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "strict"

[tool.uv.workspace]
members = [
    "fakecheck-v2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 
